defaults:
  - ../lstm.yaml

# Tuning is validation-only. Never point the tuner at the test schedule.
tuning:
  study_name: global_lstm_validation
  direction: minimize
  metric: paper_score_mean
  sampler: tpe
  sampler_seed: 52
  n_trials: 30
  n_jobs: 1
  timeout_seconds: null
  storage: null  # Example for resume: sqlite:///outputs/tuning/global_lstm_validation.db
  progress_bar: true
  tuning_seeds: [52]
  final_seeds: [52, 62, 72, 82, 92]

  search_space:
    context_length:
      type: categorical
      choices: [12, 18, 24]
    model.hidden_size:
      type: categorical
      choices: [32, 64, 128]
    model.num_layers:
      type: int
      low: 1
      high: 2
    model.dropout:
      type: categorical
      choices: [0.0, 0.1, 0.2]
    optimizer.learning_rate:
      type: float
      low: 0.0003
      high: 0.003
      log: true
    optimizer.weight_decay:
      type: categorical
      choices: [0.0, 0.0001, 0.001]
    batch_size:
      type: categorical
      choices: [128, 256, 512]
